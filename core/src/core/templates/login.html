<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --danger:#f85149; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 20%, #172234 0, var(--bg) 42%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(390px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .mark { width:42px; height:42px; border-radius:10px; display:grid; place-items:center; background:#1f6feb; font-weight:800; font-size:20px; margin-bottom:18px; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0 0 22px; color:var(--muted); font-size:14px; }
    label { display:block; margin:14px 0 6px; color:var(--muted); font-size:12px; font-weight:600; }
    input { width:100%; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); padding:10px 12px; font:inherit; outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(88,166,255,.15); }
    button { width:100%; margin-top:20px; border:0; border-radius:6px; padding:10px 12px; background:#238636; color:white; font:inherit; font-weight:650; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #error { min-height:20px; margin-top:12px; color:var(--danger); font-size:13px; }
  </style>
</head>
<body>
  <div id="__js_errors__" data-errors="" style="display:none"></div>
  <main>
    <div class="mark">L</div>
    <h1>Sign in to Lab</h1>
    <p>Local workspace access</p>
    <form id="loginForm">
      <label for="username">User</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    (() => {
      const box = document.getElementById('__js_errors__');
      const add = message => box.setAttribute('data-errors', (box.getAttribute('data-errors') || '') + message + '\n');
      window.addEventListener('error', event => add(event.message || 'Error'));
      window.addEventListener('unhandledrejection', event => add('Unhandled: ' + (event.reason?.message || event.reason)));
    })();
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || 'Sign in failed');
        }
        const params = new URLSearchParams(location.search);
        const next = params.get('next');
        location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
      } catch (err) {
        error.textContent = err.message || String(err);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
