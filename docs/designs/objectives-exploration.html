        const tree=o.worktrees.find(t=>t.id===o.selected);if(!tree){host.append(element('div','ob-muted','Associate a worktree to browse its files.'));return;}const recent=tree.id==='checkpoint'?['notes/verification.md']:tree.id==='api-tests'?['tests/test_contracts.py']:o.recent;
        recent.forEach(path=>host.append(fileButton(path,o,tree)));
        heading(host,'FILES · '+tree.name,()=>itemDialog('document',tree.id));o.files.forEach(path=>host.append(fileButton(path,o,tree)));
      }
      function fileButton(path,o,tree) {
        const getItem=()=>{const id='file-'+tree.id+'-'+path;let item=o.items.find(i=>i.id===id);if(!item){item={id,kind:path.endsWith('/')?'folder':'file',title:path,scope:tree.id,listed:false,body:path.endsWith('/')?'Folder in '+tree.name:'File in '+tree.name};o.items.push(item);}return item;};
        const b=button('','ob-file',()=>{o.selectedItem=getItem().id;renderReader();refreshIcons();});b.append(icon(path.endsWith('/')?'folder':'file-code'),element('span','',path));b.dataset.tooltip=tree.repo+' / '+tree.name+' / '+path;
        attachDrop(b,'application/x-objective-terminal',id=>{const t=terminals.find(t=>t.id===id);if(t&&t.objective===o.id){t.linked=getItem().id;renderTerminals();message('Linked '+t.name+' to '+path+' · launch folder kept');refreshIcons();}else message('Choose a terminal in '+o.name+' to link this file');});return b;
      }
      function renderReader() {
        const host=find('reader'),o=objective();const item=o.items.find(i=>i.id===o.selectedItem)||o.items[0];host.replaceChildren();if(!item){host.append(element('p','ob-muted','Choose or create a document, notebook, link, or task.'));return;}
        const top=element('div','ob-reader-head');top.append(element('h2','',item.title));top.append(button('Rename','ob-quiet',()=>renameDialog(item)));host.append(top);
        host.append(element('div','ob-muted',o.name+' / '+(item.scope?o.worktrees.find(t=>t.id===item.scope).name:'Objective')));
        const visibility=element('label','ob-visibility','Visible in '),selector=element('select');selector.setAttribute('aria-label','Resource visibility');[{id:'',name:'Whole objective'},...o.worktrees].forEach(t=>{const opt=element('option','',t.name);opt.value=t.id;selector.append(opt);});selector.value=item.scope||'';selector.onchange=()=>{item.scope=selector.value||null;render();message(item.scope?'Resource scoped to the selected worktree':'Resource visible throughout the objective');};visibility.append(selector);host.append(visibility);
        if(item.kind==='task') {
          const done=item.checks.filter(c=>c.done).length;host.append(element('p','',done+' of '+item.checks.length+' to-dos complete'));
          const checks=element('div','ob-checklist');item.checks.forEach(c=>{const label=element('label'),input=element('input');input.type='checkbox';input.checked=c.done;input.onchange=()=>{c.done=input.checked;render();};label.append(input,element('span','',c.title));checks.append(label);});host.append(checks);
          const detail=o.items.find(i=>i.id===item.detail);if(detail){host.append(element('h3','','Details'));host.append(button(detail.title,'ob-resource',()=>{o.selectedItem=detail.id;render();}));}
        } else if(item.kind==='notebook') {
          const cell=element('div','ob-cell');cell.append(element('div','ob-muted',item.id.startsWith('item-')?'In [ ]':'In [1]'));if(!item.id.startsWith('item-'))cell.append(element('pre','','rates = [0.96, 0.98, 0.99]\nmean_rate = sum(rates) / len(rates)\nprint(f"Mean verification rate: {mean_rate:.1%}")'),element('pre','ob-output','Mean verification rate: 97.7%'));host.append(cell);
        } else if(item.kind==='link') {host.append(element('p','',item.title),element('p','ob-muted',item.url),element('p','ob-muted','External link preview'));}
        else {host.append(element('p','',item.body||''));if(item.id==='incident'){host.append(element('h3','','Current work'));const ul=element('ul');['Reproduce the input that fails phone parsing.','Verify that recovery remains available.','Compare verification volume after the change.'].forEach(text=>ul.append(element('li','',text)));host.append(ul);const task=o.items.find(i=>i.id==='validate');host.append(element('h3','','Related task'),button('Validate phone parsing · '+task.checks.filter(c=>c.done).length+'/3 done','ob-resource',()=>{o.selectedItem='validate';render();}));}}
        const linked=terminals.filter(t=>t.objective===o.id&&t.linked===item.id);if(linked.length){host.append(element('h3','','Linked terminals'));linked.forEach(t=>host.append(button(t.name,'ob-resource',()=>selectTerminal(t))));}
      }
      function selectTerminal(t) {selected=t.objective;const o=objective();if(t.tree!=='objective')o.selected=t.tree;if(t.linked&&o.items.some(i=>i.id===t.linked))o.selectedItem=t.linked;activeTerminal=t.id;render();message(t.name+' · '+(t.tree==='objective'?'Objective folder':o.worktrees.find(tree=>tree.id===t.tree).name));}
      function renderTerminals() {
        const host=find('terminals');host.replaceChildren();const head=element('div','ob-terminal-heading');head.append(element('strong','','Terminals'));const mode=element('select');mode.setAttribute('aria-label','Visible terminal groups');[['all','3 objectives'],['selected','Selected objective']].forEach(([value,label])=>{const opt=element('option','',label);opt.value=value;mode.append(opt);});mode.value=config.terminalVisibility;mode.onchange=()=>{config.terminalVisibility=mode.value;renderTerminals();refreshIcons();};head.append(mode);host.append(head);
        focused.filter(id=>config.terminalVisibility==='all'||id===selected).forEach(id=>{const o=objectives.find(o=>o.id===id);const heading=element('div','ob-terminal-objective');heading.style.setProperty('--objective-color',o.color);heading.append(icon('target'),button(o.name,'',()=>switchObjective(id)));host.append(heading);
          [{id:'objective',name:'Objective folder',color:o.color},...o.worktrees].forEach(tree=>{const group=terminals.filter(t=>t.objective===id&&t.tree===tree.id);if(!group.length)return;const label=element('div','ob-terminal-tree');label.style.setProperty('--tree-color',tree.color);label.append(element('span','ob-tree-dot'),element('span','',tree.name));host.append(label);
            group.forEach(t=>{const item=o.items.find(i=>i.id===t.linked);const b=button('','ob-terminal',()=>selectTerminal(t));b.style.setProperty('--tree-color',tree.color);b.setAttribute('aria-pressed',t.id===activeTerminal);b.draggable=true;b.setAttribute('aria-label',t.name+' terminal'+(item?' linked to '+item.title:''));b.ondragstart=e=>{e.dataTransfer.setData('application/x-objective-terminal',t.id);e.dataTransfer.effectAllowed='link';};b.append(icon(item?(iconNames[item.kind]||'terminal'):'terminal'),element('span','ob-label',item?item.title:t.name));if(t.state!=='idle'){const dot=element('span','ob-status-dot'+(t.state==='ready'?' ready':''));dot.setAttribute('aria-label',t.state==='ready'?'Ready to review':'Working');b.append(dot);}host.append(b);});
          });
        });
        host.append(button('+ Terminal','ob-action ob-new-terminal',terminalDialog));const t=terminals.find(t=>t.id===activeTerminal);if(t){const console=element('div','ob-console');const folder=t.tree==='objective'?'objectives/'+t.objective:objectives.find(o=>o.id===t.objective).worktrees.find(tree=>tree.id===t.tree).name;console.append(element('strong','',t.name),element('pre','','$ pwd\n…/'+folder+'\n\nSession remains attached.'));const label=element('label','','Unsent prompt'),draft=element('input');draft.type='text';draft.value=t.draft;draft.setAttribute('aria-label','Unsent prompt for '+t.name);draft.oninput=()=>{t.draft=draft.value;};label.append(draft);console.append(label,element('div','ob-console-note','Session preview'));host.append(console);}
      }
      function dialog(title) {const host=find('dialog');host.hidden=false;host.replaceChildren(element('h3','',title));const form=element('form');host.append(form);form.append(button('Cancel','ob-quiet',()=>{host.hidden=true;}));return form;}
      function field(form,labelText,control) {const label=element('label','',labelText);label.append(control);form.insertBefore(label,form.lastChild);return control;}
      function select(options) {const el=element('select');options.forEach(o=>{const opt=element('option','',o.name);opt.value=o.id;el.append(opt);});return el;}
      function submit(form,label,action) {const b=button(label,'ob-action');b.type='submit';form.insertBefore(b,form.lastChild);form.onsubmit=e=>{e.preventDefault();action();find('dialog').hidden=true;render();};}
      function focusDialog() {
        const available=objectives.filter(o=>!focused.includes(o.id));const form=dialog('Bring an objective into focus');const pick=field(form,'Objective',select([...available,{id:'__new',name:'Create a new objective…'}]));const name=field(form,'New objective name',element('input'));name.type='text';name.parentElement.hidden=true;pick.onchange=()=>{name.parentElement.hidden=pick.value!=='__new';name.required=pick.value==='__new';};const slot=field(form,'Replace focus slot',select(focused.map((id,index)=>({id:String(index),name:objectives.find(o=>o.id===id).name}))));submit(form,'Replace',()=>{const old=focused[Number(slot.value)];let o=objectives.find(o=>o.id===pick.value);if(pick.value==='__new'){o={id:'objective-'+serial++,name:name.value.trim(),purpose:'',color:nextColor(),selected:null,selectedItem:null,draft:'',worktrees:[],items:[],recent:[],files:[]};objectives.push(o);}if(o){focused[Number(slot.value)]=o.id;selected=o.id;activeTerminal=terminals.find(t=>t.objective===o.id)?.id||null;message(o.name+' is in focus · '+objectives.find(o=>o.id===old).name+' sessions keep running');}});
      }
      function itemDialog(kind='document',scope=null) {const form=dialog('Add an objective resource');const type=field(form,'Type',select(['document','notebook','task','link'].map(id=>({id,name:id[0].toUpperCase()+id.slice(1)}))));type.value=kind;const input=field(form,'Name',element('input'));input.type='text';input.required=true;const url=field(form,'URL for a link',element('input'));url.type='text';submit(form,'Create',()=>{const o=objective(),k=type.value;let title=input.value.trim();if(k==='notebook'&&!title.endsWith('.ipynb'))title+='.ipynb';const item={id:'item-'+serial++,kind:k,title,scope,body:'',url:url.value,checks:k==='task'?[{title,done:false}]:undefined};o.items.push(item);o.selectedItem=item.id;message('Created '+title+' in '+o.name+' · sample data');});}
      function renameDialog(item) {const form=dialog('Rename '+item.kind),input=field(form,'Name',element('input'));input.type='text';input.value=item.title;input.required=true;submit(form,'Rename',()=>{item.title=input.value.trim();if(item.kind==='notebook'&&!item.title.endsWith('.ipynb'))item.title+='.ipynb';message('Renamed resource · its links remain intact');});}
      function nextColor() {const used=new Set(objectives.flatMap(o=>[o.color,...o.worktrees.map(t=>t.color)]));return ['#3fb950','#f778ba','#a9d14c','#d29922','#79c0ff','#ff9bce','#da9dff','#8ddb8c'].find(c=>!used.has(c))||'hsl('+((serial*137.508)%360)+' 66% 65%)';}
      function worktreeDialog() {const form=dialog('Associate a worktree');const action=field(form,'Action',select([{id:'existing',name:'Bring an existing worktree'},{id:'new',name:'Create a new worktree'}]));const repo=field(form,'Repository',select([{id:'client',name:'client'},{id:'service',name:'service'}]));const name=field(form,'Worktree / branch name',element('input'));name.type='text';name.value='fix/follow-up';name.required=true;submit(form,'Associate',()=>{const o=objective(),tree={id:'tree-'+serial++,name:name.value.trim(),repo:repo.value,color:nextColor()};o.worktrees.push(tree);o.selected=tree.id;message((action.value==='new'?'Created':'Associated')+' '+tree.name+' with '+o.name+' · sample data');});}
      function terminalDialog() {const o=objective(),form=dialog('New terminal · '+o.name),scope=field(form,'Launch folder',select([{id:'objective',name:'Objective folder'},...o.worktrees]));scope.value=o.selected;submit(form,'Open terminal',()=>{const id='terminal-'+serial++,tree=scope.value;const t={id,objective:o.id,tree,name:'Terminal '+serial,linked:null,state:'idle',draft:''};terminals.push(t);activeTerminal=id;message('Opened terminal preview · launch folder remains fixed');});}
      function settingsDialog() {const form=dialog('Objective settings'),o=objective(),input=field(form,'Objective name',element('input'));input.type='text';input.value=o.name;input.required=true;submit(form,'Save',()=>{o.name=input.value.trim();message('Objective renamed · files and references remain associated');});}
      function render() {renderFocus();renderOverview();renderReader();renderTerminals();refreshIcons();}
      render();
      if(globalThis.Tweak) {const tweak=new globalThis.Tweak({container:root,onChange:render});tweak.addToggle(config,'groupResources',{label:'Combine documents and links'});tweak.addSelect(config,'terminalVisibility',{label:'Terminal visibility',options:[{value:'all',label:'All three objectives'},{value:'selected',label:'Selected objective'}]});}
    })();
  </script>
</div>
